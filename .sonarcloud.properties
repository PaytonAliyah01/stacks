# SonarCloud automatic analysis settings.
# The supabase/*.sql files are Postgres setup scripts that were already run once in the
# Supabase SQL editor. SonarCloud reads them with its Oracle PL/SQL rules, which don't fit
# Postgres (for example "define a constant for this repeated literal" in row policies),
# so those scripts are left out of the analysis.
sonar.exclusions=supabase/**/*.sql
