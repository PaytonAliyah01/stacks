# SonarCloud automatic analysis settings.
# The supabase/*.sql files are Postgres setup scripts that were already run once in the
# Supabase SQL editor. SonarCloud reads them with its Oracle PL/SQL rules, and the
# "define a constant for this repeated literal" rule doesn't fit Postgres policies
# ('avatars', 'accepted', ...), so that one rule is switched off for those files only.
sonar.issue.ignore.multicriteria=sql1
sonar.issue.ignore.multicriteria.sql1.ruleKey=plsql:S1192
sonar.issue.ignore.multicriteria.sql1.resourceKey=supabase/**/*.sql
